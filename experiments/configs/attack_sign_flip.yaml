# Sign-flip attack experiment configuration

dataset: MNIST
data_root: ./data
model: LeNet5

num_clients: 10
clients_per_round: 10
num_rounds: 10
local_epochs: 2
batch_size: 32
lr: 0.01
momentum: 0.9
weight_decay: 1.0e-4

# We use Non-IID here because poisoning detection is harder under Non-IID.
# This establishes the baseline for Phase 4-7.
partition: noniid
alpha: 0.5

# 30% malicious clients
attack: sign_flip
malicious_fraction: 0.3

defense: fedavg
seed: 42
results_dir: experiments/results
